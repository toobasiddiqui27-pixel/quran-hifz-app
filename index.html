<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Hifz AI Teacher - Full Quran</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #fdfbf7; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h1 { color: #1b4332; margin-bottom: 25px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        select, button { padding: 10px 15px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
        select { background: #fff; cursor: pointer; }
        button { background: #2d6a4f; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #1b4332; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .quran-verse { font-size: 30px; color: #1b4332; margin: 25px 0; font-family: 'Amiri', 'Traditional Arabic', serif; line-height: 1.8; background: #f4f9f4; padding: 15px; border-radius: 10px; }
        .status { margin-top: 15px; font-weight: bold; font-size: 18px; }
        .correct { color: #2b9348; }
        .wrong { color: #d90429; }
        .transcript { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 18px; border: 1px dashed #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📖 قرآن حفظ اے آئی ٹیچر</h1>
        
        <div class="controls">
            <select id="surahSelect" onchange="loadSurah()">
                <option value="">سورة منتخب کریں...</option>
            </select>
            
            <select id="ayahSelect" onchange="loadAyah()">
                <option value="">آیت منتخب کریں...</option>
            </select>
        </div>

        <div class="quran-verse" id="targetVerse">برائے مہربانی سورة اور آیت کا انتخاب کریں۔</div>

        <button id="startBtn" onclick="startRecognition()" disabled>🎙️ تلاوت شروع کریں</button>

        <div class="status" id="status"></div>
        <div class="transcript" id="transcript">آپ کی آواز یہاں ظاہر ہوگی...</div>
    </div>

    <script>
        let currentTargetText = "";
        let recognition = null;

        // 1. تمام 114 سورتوں کی لسٹ ڈاؤنلوڈ کرنا
        async function fetchSurahs() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const surahSelect = document.getElementById('surahSelect');
                
                data.data.forEach(surah => {
                    let option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.name} (${surah.englishName})`;
                    surahSelect.appendChild(option);
                });
            } catch (err) {
                document.getElementById('status').innerText = "سورتوں کا ڈیٹا لوڈ کرنے میں ناکامی ہوئی۔";
            }
        }

        // 2. منتخب سورة کے مطابق آیتوں کی تعداد بنانا
        async function loadSurah() {
            const surahNum = document.getElementById('surahSelect').value;
            const ayahSelect = document.getElementById('ayahSelect');
            ayahSelect.innerHTML = '<option value="">آیت منتخب کریں...</option>';
            document.getElementById('targetVerse').innerText = "آیت منتخب کریں...";
            document.getElementById('startBtn').disabled = true;

            if (!surahNum) return;

            const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
            const data = await response.json();
            const totalAyahs = data.data.numberOfAyahs;

            for (let i = 1; i <= totalAyahs; i++) {
                let option = document.createElement('option');
                option.value = i;
                option.textContent = `آیت ${i}`;
                ayahSelect.appendChild(option);
            }
        }

        // 3. منتخب آیت کا عربی متن لانا
        async function loadAyah() {
            const surahNum = document.getElementById('surahSelect').value;
            const ayahNum = document.getElementById('ayahSelect').value;

            if (!surahNum || !ayahNum) return;

            document.getElementById('targetVerse').innerText = "آیت لوڈ ہو رہی ہے...";

            const response = await fetch(`https://api.alquran.cloud/v1/ayah/${surahNum}:${ayahNum}/ar.alafasy`);
            const data = await response.json();
            
            currentTargetText = data.data.text;
            document.getElementById('targetVerse').innerText = currentTargetText;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('status').innerText = "";
            document.getElementById('transcript').innerText = "آپ کی آواز یہاں ظاہر ہوگی...";
        }

        // اعراب (زبر، زیر، پیش) کو ہٹا کر ٹیکسٹ میچ کرنے کا فنکشن
        function normalizeText(text) {
            return text.replace(/[\u064B-\u0652]/g, "").trim();
        }

        // 4. آواز کی شناخت (Speech Recognition)
        function startRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("آپ کا براؤزر Speech API کو سپورٹ نہیں کرتا۔ Google Chrome استعمال کریں۔");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ar';
            recognition.interimResults = true;

            document.getElementById('status').innerText = "🎙️ سن رہا ہوں... تلاوت شروع کریں!";
            document.getElementById('status').className = "status";
            document.getElementById('startBtn').disabled = true;

            recognition.start();

            recognition.onresult = function(event) {
                let spokenText = "";
                for (let i = 0; i < event.results.length; i++) {
                    spokenText += event.results[i][0].transcript;
                }
                
                document.getElementById('transcript').innerText = "آپ نے پڑھا: " + spokenText;

                const cleanSpoken = normalizeText(spokenText);
                const cleanTarget = normalizeText(currentTargetText);

                if (cleanSpoken.includes(cleanTarget) || cleanTarget.includes(cleanSpoken)) {
                    document.getElementById('status').innerText = "✅ بالکل درست! ماشاء اللہ";
                    document.getElementById('status').className = "status correct";
                } else {
                    document.getElementById('status').innerText = "❌ غلطی ہے! دوبارہ کوشش کریں۔";
                    document.getElementById('status').className = "status wrong";
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = "آواز نہیں سنی جا سکی، دوبارہ کوشش کریں۔";
                document.getElementById('startBtn').disabled = false;
            };

            recognition.onend = function() {
                document.getElementById('startBtn').disabled = false;
            };
        }

        // پیج لوڈ ہوتے ہی سورتیں حاصل کرنا
        fetchSurahs();
    </script>
</body>
</html>
